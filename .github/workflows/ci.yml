name: NumPy neural network checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # unittest is part of Python; NumPy is the only installed dependency.
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Built-in node:test; no npm packages or browser CDNs needed.
      - run: node --test
      - run: node --check static/engine.js && node --check static/worker.js && node --check static/app.js
